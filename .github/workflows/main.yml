name: Build Android APK

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Debug APK
        run: |
          set -euo pipefail
          ASSEMBLE_TASK=$(gradle tasks --all --console=plain | sed -n 's/^\([[:alnum:]_:-]*assembleDebug\) - .*/\1/p' | head -n 1)
          if [ -z "$ASSEMBLE_TASK" ]; then
            echo "No assembleDebug task found; skipping APK build."
            exit 0
          fi
          echo "Running Gradle task: $ASSEMBLE_TASK"
          gradle "$ASSEMBLE_TASK" --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GeminiPdfTranslator-APK
          path: "**/build/outputs/apk/debug/*.apk"
